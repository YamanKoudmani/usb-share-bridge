name: "USB Share Bridge"
description: "USB/IP client that attaches USB devices shared from a Windows (usbipd-win) or Linux server so Home Assistant sees them as local devices."
version: "1.1.1"
slug: "usb_share_bridge"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
apparmor: true
usb: true
kernel_modules:
  - vhci-hcd
privileged:
  - NET_ADMIN
  - SYS_ADMIN
  - SYS_MODULE
  - SYS_RAWIO
options:
  server: "192.168.1.100"
  attach_mode: all
  devices:
    - name: "Optional in select mode"
      id: "0bda:2838"
  poll_interval: 30
  attach_delay: 2
  attach_retries: 3
  auto_reattach: true
  rediscover_cycles: 20
  log_level: info
schema:
  server: str
  attach_mode: list(all|select)
  devices:
    - name: str
      id: str
  poll_interval: "int(10,600)?"
  attach_delay: "int(0,30)?"
  attach_retries: "int(0,10)?"
  auto_reattach: bool?
  rediscover_cycles: "int(1,100)?"
  log_level: list(debug|info|warning|error)
